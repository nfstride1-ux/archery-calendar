# Serves the committed site and checks it still loads. Does not refresh data
# and does not change files. The job name "smoke" is the check to require
# before merging (see PROJECT_RULES.md).
name: Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Chrome
        run: |
          set -euo pipefail
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/chrome.deb
          /opt/google/chrome/chrome --version

      - name: Run the smoke test
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: python3 scripts/smoke_test.py
